# This is the tox configuration file to run tests, linter and coverage.
# Configuration doc available at https://tox.wiki/en/latest/config.html

[tox]
requires =
    tox>=4.6.0
envlist = py{39,310,311,312}, pylint, coverage

[gh-actions]
python =
    3.9: py39
    3.10: py310
    3.11: py311
    3.12: py312, pylint, coverage

[testenv]
package = editable
extras = dev
allowlist_externals =
    bash

[testenv:py{39,310,311,312}]
commands =
    pytest -v --junitxml=artifacts/unittest/reports/TEST-{envname}.xml

[testenv:pylint]
commands =
    bash -c 'mkdir -p artifacts; pylint --rcfile=.pylintrc --output-format=text,text:artifacts/pylint.txt src'

[testenv:coverage]
commands =
    bash -c 'echo "WIP"'
