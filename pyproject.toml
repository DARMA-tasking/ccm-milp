[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ccm-milp"
dynamic = ["version"]
description = "Mixed-integer linear programming formulation of the CCM load-balancing problem"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "pulp",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pylint",
    "pytest",
]

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
